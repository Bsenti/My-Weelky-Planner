<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WEEKLY PLANNER</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3ca8ad">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .font-roboto-condensed { font-family: 'Roboto Condensed', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { chalcedony: {
        50: '#f0f9f9', 100: '#dcf2f2', 200: '#bce4e5',
        300: '#8ecfd1', 400: '#58b2b6', 500: '#3ca8ad',
        600: '#2e7d82', 700: '#2a6569', 800: '#265256', 900: '#234447'
      } } } }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_CATEGORIES = [
      { id: 'cat-uncategorized', name: '미분류', order: 1 },
      { id: 'cat-dorm', name: '🏡', order: 2 },
      { id: 'cat-family', name: '🏠', order: 3 },
      { id: 'cat-hospital', name: '🏥', order: 4 },
      { id: 'cat-study', name: '✒️', order: 5 },
      { id: 'cat-vacation', name: '🏖', order: 6 },
      { id: 'cat-vehicle', name: '🚗', order: 7 },
      { id: 'cat-work', name: '🦺', order: 8 },
      { id: 'cat-church', name: '💒', order: 9 }
    ];
    const INITIAL_ROUTINES = [
      { id: 'r1', title: '일 찍 자 기🔥', completedDays: {} },
      { id: 'r2', title: '계시록 노트 묵상(매일 10분)', completedDays: {} },
      { id: 'r3', title: '지출 입력하기(금요일 저녁)', completedDays: {} },
      { id: 'r4', title: '차주 계획 세우기(토요일 저녁)', completedDays: {} }
    ];

    const Icon = ({ name, className = 'w-4 h-4' }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // [추가] 같은 카테고리/요일 안에서 해당 항목의 위치만 교환
    const moveWithinGroup = (list, id, direction, belongsToGroup) => {
      const visible = list.filter(belongsToGroup);
      const position = visible.findIndex(item => item.id === id);
      const target = visible[position + direction];
      if (position < 0 || !target) return list;
      const a = list.findIndex(item => item.id === id);
      const b = list.findIndex(item => item.id === target.id);
      const result = [...list];
      [result[a], result[b]] = [result[b], result[a]];
      return result;
    };

    const App = () => {
      const [showSplash, setShowSplash] = useState(true);
      const [activeTab, setActiveTab] = useState('todos');
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('wp_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('wp_todos');
        return saved ? JSON.parse(saved) : [];
      });
      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('wp_schedules');
        return saved ? JSON.parse(saved) : [];
      });
      const [routines, setRoutines] = useState(() => {
        const saved = localStorage.getItem('wp_routines');
        return saved ? JSON.parse(saved) : INITIAL_ROUTINES;
      });
      const [monthlyPlans, setMonthlyPlans] = useState(() => {
        const saved = localStorage.getItem('wp_monthlyPlans');
        return saved ? JSON.parse(saved) : {};
      });

      const [weekOffset, setWeekOffset] = useState(0);
      const [currentMonthNav, setCurrentMonthNav] = useState(() => {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth() + 1 };
      });
      const [deleteModal, setDeleteModal] = useState({ isOpen: false, title: '', type: '', id: null });
      const [importModal, setImportModal] = useState({ isOpen: false, targetDate: '' });
      const [editCatModal, setEditCatModal] = useState({ isOpen: false, category: null });
      const [expandedScheduleId, setExpandedScheduleId] = useState(null);
      const [selectedStatPeriod, setSelectedStatPeriod] = useState('weekly');
      // [추가] 할 일 / 루틴 / 요일별 일정 / 월간 일정 공통 수정창
      const [editModal, setEditModal] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [newTodoInput, setNewTodoInput] = useState('');
      const [selectedCatForNewTodo, setSelectedCatForNewTodo] = useState(INITIAL_CATEGORIES[0].id);
      const [newCatName, setNewCatName] = useState('');
      const [newRoutineInput, setNewRoutineInput] = useState('');
      const [newMonthlyInput, setNewMonthlyInput] = useState('');

      useEffect(() => {
        const timer = setTimeout(() => setShowSplash(false), 1500);
        return () => clearTimeout(timer);
      }, []);
      useEffect(() => { localStorage.setItem('wp_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('wp_todos', JSON.stringify(todos)); }, [todos]);
      useEffect(() => { localStorage.setItem('wp_schedules', JSON.stringify(schedules)); }, [schedules]);
      useEffect(() => { localStorage.setItem('wp_routines', JSON.stringify(routines)); }, [routines]);
      useEffect(() => { localStorage.setItem('wp_monthlyPlans', JSON.stringify(monthlyPlans)); }, [monthlyPlans]);

      const todayStr = new Date().toISOString().split('T')[0];
      const currentYear = new Date().getFullYear();
      const getWeekDaysByOffset = (offset) => {
        const curr = new Date();
        const first = curr.getDate() - curr.getDay() + 1 + (offset * 7);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const next = new Date(curr.valueOf());
          next.setDate(first + i);
          days.push(next.toISOString().split('T')[0]);
        }
        return days;
      };
      const weekDays = useMemo(() => getWeekDaysByOffset(weekOffset), [weekOffset]);

      // [유지] 지난주 미완료 일정은 앱 시작 시 할 일로 복귀
      useEffect(() => {
        const mondayOfThisWeek = getWeekDaysByOffset(0)[0];
        const expiredUncompleted = schedules.filter(s => !s.completed && s.date < mondayOfThisWeek);
        if (expiredUncompleted.length > 0) {
          const restoredTodos = expiredUncompleted.map(item => ({
            id: item.sourceTodoId || `todo-restored-${Date.now()}-${Math.random()}`,
            categoryId: item.categoryId || 'cat-uncategorized',
            title: item.title, details: item.details || '', completed: false,
            createdAt: new Date().toISOString()
          }));
          setTodos(prev => [...restoredTodos, ...prev]);
          setSchedules(prev => prev.filter(s => !(!s.completed && s.date < mondayOfThisWeek)));
        }
      }, []);

      const requestDelete = (title, type, id) => setDeleteModal({ isOpen: true, title, type, id });
      const confirmDelete = () => {
        const { type, id } = deleteModal;
        if (type === 'todo') setTodos(prev => prev.filter(i => i.id !== id));
        if (type === 'schedule') setSchedules(prev => prev.filter(i => i.id !== id));
        if (type === 'routine') setRoutines(prev => prev.filter(i => i.id !== id));
        if (type === 'monthly') {
          setMonthlyPlans(prev => {
            const copy = JSON.parse(JSON.stringify(prev));
            const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
            if (copy[y]?.months?.[m]) copy[y].months[m] = copy[y].months[m].filter(i => i.id !== id);
            return copy;
          });
        }
        if (type === 'category') {
          setCategories(prev => prev.filter(c => c.id !== id));
          setTodos(prev => prev.map(t => t.categoryId === id ? { ...t, categoryId: 'cat-uncategorized' } : t));
        }
        setDeleteModal({ isOpen: false, title: '', type: '', id: null });
      };

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodoInput.trim()) return;
        setTodos(prev => [{
          id: `todo-${Date.now()}`, categoryId: selectedCatForNewTodo,
          title: newTodoInput.trim(), details: '', completed: false,
          createdAt: new Date().toISOString()
        }, ...prev]);
        setNewTodoInput('');
      };
      const handleAddRoutine = (e) => {
        e.preventDefault();
        if (!newRoutineInput.trim()) return;
        setRoutines(prev => [...prev, {
          id: `routine-${Date.now()}`, title: newRoutineInput.trim(), completedDays: {}
        }]);
        setNewRoutineInput('');
      };
      const handleAddMonthlyPlan = (e) => {
        e.preventDefault();
        if (!newMonthlyInput.trim()) return;
        setMonthlyPlans(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
          if (!copy[y]) copy[y] = { year: currentMonthNav.year, months: {} };
          if (!copy[y].months[m]) copy[y].months[m] = [];
          copy[y].months[m].push({
            id: `mitem-${Date.now()}`, month: currentMonthNav.month,
            year: currentMonthNav.year, content: newMonthlyInput.trim(),
            details: '', createdAt: new Date().toISOString()
          });
          return copy;
        });
        setNewMonthlyInput('');
      };
      const toggleRoutineDay = (routineId, dateStr) => {
        setRoutines(prev => prev.map(r => r.id === routineId ? {
          ...r, completedDays: { ...r.completedDays, [dateStr]: !r.completedDays?.[dateStr] }
        } : r));
      };
      const handleUpdateScheduleDetails = (id, details) => {
        setSchedules(prev => prev.map(s => s.id === id ? { ...s, details } : s));
      };
      const toggleScheduleComplete = (id) => {
        setSchedules(prev => prev.map(s => s.id === id ? {
          ...s, completed: !s.completed,
          completedAt: !s.completed ? new Date().toISOString().split('T')[0] : null
        } : s));
      };
      const toggleTodoComplete = (id) => {
        setTodos(prev => prev.map(t => t.id === id ? {
          ...t, completed: !t.completed,
          completedAt: !t.completed ? new Date().toISOString().split('T')[0] : null
        } : t));
      };
      const handleSaveCategory = () => {
        if (!newCatName.trim()) return;
        if (editCatModal.category) {
          setCategories(prev => prev.map(c => c.id === editCatModal.category.id ? { ...c, name: newCatName.trim() } : c));
        } else {
          setCategories(prev => [...prev, { id: `cat-${Date.now()}`, name: newCatName.trim(), order: categories.length + 1 }]);
        }
        setNewCatName('');
        setEditCatModal({ isOpen: false, category: null });
      };
      const handleImportTodoToSchedule = (todoItem) => {
        setSchedules(prev => [...prev, {
          id: `sched-${Date.now()}`, title: todoItem.title,
          details: todoItem.details || '', categoryId: todoItem.categoryId,
          date: importModal.targetDate, completed: false,
          sourceTodoId: todoItem.id, createdAt: new Date().toISOString()
        }]);
        setTodos(prev => prev.filter(t => t.id !== todoItem.id));
        setImportModal({ isOpen: false, targetDate: '' });
      };

      // [추가] 개별 수정 (완료 체크 기록과 기존 데이터 필드 유지)
      const openEdit = (type, item) => setEditModal({
        type, id: item.id,
        title: type === 'monthly' ? item.content : item.title,
        details: item.details || '',
        date: item.date || ''
      });
      const saveEdit = (e) => {
        e.preventDefault();
        if (!editModal || !editModal.title.trim()) return;
        const { type, id, title, details, date } = editModal;
        const cleanTitle = title.trim();
        if (type === 'todo') {
          setTodos(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle, details } : i));
        } else if (type === 'routine') {
          setRoutines(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle } : i));
        } else if (type === 'schedule') {
          if (!date) return alert('이동할 날짜를 선택해 주세요.');
          setSchedules(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle, details, date } : i));
        } else if (type === 'monthly') {
          setMonthlyPlans(prev => {
            const copy = JSON.parse(JSON.stringify(prev));
            const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
            if (copy[y]?.months?.[m]) {
              copy[y].months[m] = copy[y].months[m].map(i => i.id === id ? { ...i, content: cleanTitle, details } : i);
            }
            return copy;
          });
        }
        setEditModal(null);
      };
      // [추가] 같은 주에서 요일 옮기기 / 공통 수정창에서 날짜 변경 가능
      const moveScheduleToDate = (id, date) => {
        if (!date) return;
        setSchedules(prev => prev.map(i => i.id === id ? { ...i, date } : i));
        setExpandedScheduleId(null);
      };
      // [추가] 같은 카테고리 및 같은 요일 내 순서 바꾸기
      const moveTodo = (item, direction) => setTodos(prev =>
        moveWithinGroup(prev, item.id, direction, i => i.categoryId === item.categoryId && !i.completed));
      const moveRoutine = (item, direction) => setRoutines(prev =>
        moveWithinGroup(prev, item.id, direction, () => true));
      const moveSchedule = (item, direction) => setSchedules(prev =>
        moveWithinGroup(prev, item.id, direction, i => i.date === item.date));
      const moveMonthly = (id, direction) => {
        setMonthlyPlans(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
          if (copy[y]?.months?.[m]) {
            copy[y].months[m] = moveWithinGroup(copy[y].months[m], id, direction, () => true);
          }
          return copy;
        });
      };

      // [유지/개선] 백업·복원 (JSON 파일로 다운로드 및 파일 선택)
      const downloadBackup = () => {
        const data = {
          backupVersion: 1, backupDate: new Date().toISOString(),
          categories, todos, schedules, routines, monthlyPlans
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `weekly_planner_backup_${new Date().toLocaleDateString('sv-SE')}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };
      const restoreBackup = async (e) => {
        const input = e.currentTarget;
        const file = input.files?.[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const valid = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
            && Array.isArray(parsed.todos) && Array.isArray(parsed.schedules)
            && Array.isArray(parsed.routines) && parsed.monthlyPlans
            && typeof parsed.monthlyPlans === 'object' && !Array.isArray(parsed.monthlyPlans)
            && (parsed.categories === undefined || Array.isArray(parsed.categories));
          if (!valid) throw new Error('잘못된 백업 파일');
          if (!window.confirm('현재 저장된 데이터가 백업 파일 내용으로 변경됩니다. 계속하시겠습니까?')) return;
          if (parsed.categories) setCategories(parsed.categories);
          setTodos(parsed.todos);
          setSchedules(parsed.schedules);
          setRoutines(parsed.routines);
          setMonthlyPlans(parsed.monthlyPlans);
          alert('데이터가 성공적으로 복원되었습니다!');
        } catch (err) {
          alert('올바른 백업 JSON 파일이 아닙니다.');
        } finally {
          input.value = '';
        }
      };

      const stats = useMemo(() => {
        const completedSchedulesAll = schedules.filter(s => s.completed);
        const completedTodosAll = todos.filter(t => t.completed);
        const yearlyCompletedCount = completedSchedulesAll.length + completedTodosAll.length;
        const calcRate = (done, total) => total > 0 ? Math.round((done / total) * 100) : 0;
        const totalRoutineSlots = routines.length * 7;
        let completedRoutineSlots = 0;
        routines.forEach(r => weekDays.forEach(d => { if (r.completedDays?.[d]) completedRoutineSlots++; }));
        const routineRate = calcRate(completedRoutineSlots, totalRoutineSlots);
        const scheduleRate = calcRate(schedules.filter(s => s.completed).length, schedules.length);
        return {
          yearlyCompletedCount,
          weekly: { routineRate, scheduleRate },
          monthly: { routineRate, scheduleRate },
          yearly: { routineRate, scheduleRate }
        };
      }, [schedules, todos, routines, weekDays]);

      // 자주 사용하는 편집 / 순서 변경 버튼
      const EditButton = ({ onClick }) => (
        <button type="button" onClick={onClick} title="수정" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
          <Icon name="pencil" className="w-3.5 h-3.5" />
        </button>
      );
      const OrderButtons = ({ onUp, onDown }) => (
        <>
          <button type="button" onClick={onUp} title="위로 이동" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
            <Icon name="arrow-up" className="w-3.5 h-3.5" />
          </button>
          <button type="button" onClick={onDown} title="아래로 이동" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
            <Icon name="arrow-down" className="w-3.5 h-3.5" />
          </button>
        </>
      );

      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-slate-900 text-white flex flex-col items-center justify-center z-50 p-4">
            <div className="text-center space-y-3 font-roboto-condensed tracking-wider">
              <h1 className="text-3xl font-bold text-chalcedony-400">MY WEEKLY PLANNER</h1>
              <p className="text-sm text-slate-300 font-light">- 개발자 : 이종민-</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-3 sm:px-6 pt-4">
          {/* ====== 헤더 (기존 디자인 유지) ====== */}
          <header className="bg-white border border-slate-200 rounded-2xl p-3 sm:p-4 mb-6 shadow-xs sticky top-2 z-30">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 flex-shrink-0">
                <div className="w-8 h-8 rounded-xl bg-chalcedony-500 flex items-center justify-center text-white font-bold text-sm shadow-sm">📅</div>
                <div>
                  <h1 className="text-sm font-bold text-slate-900 leading-none">MY WEEKLY PLANNER</h1>
                  <span className="text-[10px] text-chalcedony-600 font-semibold block mt-1">Chalcedony Edition</span>
                </div>
              </div>
              <nav className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-medium overflow-x-auto no-scrollbar">
                {[
                  ['todos', `할 일 (${todos.filter(t => !t.completed).length})`],
                  ['weekly', '주간'], ['monthly', '월간'],
                  ['completed', '완료된 일정'], ['stats', '통계'], ['settings', '설정']
                ].map(([id, label]) => (
                  <button key={id} onClick={() => setActiveTab(id)}
                    className={`whitespace-nowrap px-3 py-1.5 rounded-lg transition ${activeTab === id ? 'bg-chalcedony-500 text-white font-bold shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                    {label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* ====== 1. 할 일 ====== */}
          {activeTab === 'todos' && (
            <div className="space-y-6">
              <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                  <Icon name="plus-circle" className="w-4 h-4 text-chalcedony-500" /> 새 할 일 추가
                </h2>
                <form onSubmit={handleAddTodo} className="flex flex-col sm:flex-row gap-2">
                  <select value={selectedCatForNewTodo} onChange={e => setSelectedCatForNewTodo(e.target.value)}
                    className="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500">
                    {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                  </select>
                  <input type="text" placeholder="할 일을 입력하세요..." value={newTodoInput}
                    onChange={e => setNewTodoInput(e.target.value)}
                    className="flex-1 bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                  <button type="submit" className="bg-chalcedony-500 hover:bg-chalcedony-600 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition shadow-xs whitespace-nowrap">추가</button>
                </form>
              </div>
              <div className="flex justify-between items-center px-1">
                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">카테고리별 목록</h3>
                <button onClick={() => { setNewCatName(''); setEditCatModal({ isOpen: true, category: null }); }}
                  className="text-xs text-chalcedony-600 font-semibold hover:underline flex items-center gap-1">
                  <Icon name="folder-plus" className="w-3.5 h-3.5" /> 카테고리 추가
                </button>
              </div>
              <div className="space-y-4">
                {categories.map(cat => {
                  const catTodos = todos.filter(t => t.categoryId === cat.id && !t.completed);
                  return (
                    <div key={cat.id} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">

          {deleteModal.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800 text-center">
                  '<span className="text-chalcedony-600">{deleteModal.title}</span>' 항목을 삭제하시겠습니까?
                </h3>
                <div className="flex gap-2">
                  <button onClick={() => setDeleteModal({ isOpen: false, title: '', type: '', id: null })}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold hover:bg-slate-200">아니오</button>
                  <button onClick={confirmDelete} className="flex-1 bg-red-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-red-600 shadow-xs">예 (삭제)</button>
                </div>
              </div>
            </div>
          )}

          {/* ====== 가져오기 팝업 ====== */}
          {importModal.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 border border-slate-100 max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-xs font-bold text-slate-800">[{importModal.targetDate}]에 가져올 할 일 선택</h3>
                  <button onClick={() => setImportModal({ isOpen: false, targetDate: '' })} className="text-slate-400">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {todos.filter(t => !t.completed).length === 0 ? (
                    <p className="text-xs text-slate-400 py-6 text-center">가져올 할 일이 없습니다.</p>
                  ) : (
                    todos.filter(t => !t.completed).map(todo => (
                      <div key={todo.id} onClick={() => handleImportTodoToSchedule(todo)}
                        className="p-3 rounded-xl bg-slate-50 hover:bg-chalcedony-50 border border-slate-100 hover:border-chalcedony-300 cursor-pointer flex justify-between items-center transition">
                        <span className="text-xs text-slate-700 font-medium">{todo.title}</span>
                        <Icon name="chevron-right" className="w-4 h-4 text-chalcedony-500" />
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ====== 카테고리 추가/수정 팝업 ====== */}
          {editCatModal.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800">{editCatModal.category ? '카테고리 수정' : '새 카테고리 추가'}</h3>
                <input type="text" placeholder="예: 🏠 가정, 🏥 병원 등" value={newCatName} onChange={e => setNewCatName(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                <div className="flex gap-2">
                  <button onClick={() => setEditCatModal({ isOpen: false, category: null })}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold">취소</button>
                  <button onClick={handleSaveCategory}
                    className="flex-1 bg-chalcedony-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-chalcedony-600">저장</button>
                </div>
              </div>
            </div>
          )}

          {/* ====== [추가] 공통 개별 수정 팝업 ====== */}
          {editModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEdit} className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800">
                  {editModal.type === 'todo' ? '할 일 수정' : editModal.type === 'routine' ? '루틴 수정' : editModal.type === 'schedule' ? '요일별 일정 수정 · 날짜 이동' : '월간 일정 수정'}
                </h3>
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-600">제목</label>
                  <input type="text" required autoFocus value={editModal.title}
                    onChange={e => setEditModal(prev => ({ ...prev, title: e.target.value }))}
                    className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                </div>
                {editModal.type !== 'routine' && (
                  <div className="space-y-1.5">
                    <label className="text-xs font-semibold text-slate-600">세부 메모</label>
                    <textarea rows="3" value={editModal.details}
                      onChange={e => setEditModal(prev => ({ ...prev, details: e.target.value }))}
                      className="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                  </div>
                )}
                {editModal.type === 'schedule' && (
                  <div className="space-y-1.5">
                    <label className="text-xs font-semibold text-slate-600">일정 날짜 (변경하면 해당 날짜로 이동)</label>
                    <input type="date" required value={editModal.date}
                      onChange={e => setEditModal(prev => ({ ...prev, date: e.target.value }))}
                      className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                    <p className="text-[10px] text-slate-400">지난주 이전으로 이동한 미완료 일정은 다음 앱 시작 때 할 일로 복귀하는 기존 규칙이 적용됩니다.</p>
                  </div>
                )}
                <div className="flex gap-2">
                  <button type="button" onClick={() => setEditModal(null)}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold">취소</button>
                  <button type="submit" className="flex-1 bg-chalcedony-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-chalcedony-600">저장</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
