<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WEEKLY PLANNER</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3ca8ad">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .font-roboto-condensed { font-family: 'Roboto Condensed', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { chalcedony: {
        50: '#f0f9f9', 100: '#dcf2f2', 200: '#bce4e5',
        300: '#8ecfd1', 400: '#58b2b6', 500: '#3ca8ad',
        600: '#2e7d82', 700: '#2a6569', 800: '#265256', 900: '#234447'
      } } } }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_CATEGORIES = [
      { id: 'cat-uncategorized', name: '미분류', order: 1 },
      { id: 'cat-dorm', name: '🏡', order: 2 },
      { id: 'cat-family', name: '🏠', order: 3 },
      { id: 'cat-hospital', name: '🏥', order: 4 },
      { id: 'cat-study', name: '✒️', order: 5 },
      { id: 'cat-vacation', name: '🏖', order: 6 },
      { id: 'cat-vehicle', name: '🚗', order: 7 },
      { id: 'cat-work', name: '🦺', order: 8 },
      { id: 'cat-church', name: '💒', order: 9 }
    ];
    const WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];
    // 기기 현지 날짜를 YYYY-MM-DD로 변환합니다. UTC로 바꾸지 않으므로 자정에 날짜가 어긋나지 않습니다.
    const getLocalDateString = (date) =>
      `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    const ALL_WEEKDAY_INDICES = [0, 1, 2, 3, 4, 5, 6];
    const routineWeekdays = routine => Array.isArray(routine.scheduledWeekdays)
      ? routine.scheduledWeekdays : ALL_WEEKDAY_INDICES;

    const INITIAL_ROUTINES = [
      { id: 'r1', title: '일 찍 자 기🔥', completedDays: {} },
      { id: 'r2', title: '계시록 노트 묵상(매일 10분)', completedDays: {} },
      { id: 'r3', title: '지출 입력하기(금요일 저녁)', completedDays: {} },
      { id: 'r4', title: '차주 계획 세우기(토요일 저녁)', completedDays: {} }
    ];

    const Icon = ({ name, className = 'w-4 h-4' }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // [추가] 같은 카테고리/요일 안에서 해당 항목의 위치만 교환
    const moveWithinGroup = (list, id, direction, belongsToGroup) => {
      const visible = list.filter(belongsToGroup);
      const position = visible.findIndex(item => item.id === id);
      const target = visible[position + direction];
      if (position < 0 || !target) return list;
      const a = list.findIndex(item => item.id === id);
      const b = list.findIndex(item => item.id === target.id);
      const result = [...list];
      [result[a], result[b]] = [result[b], result[a]];
      return result;
    };

    const App = () => {
      const [showSplash, setShowSplash] = useState(true);
      const [activeTab, setActiveTab] = useState('todos');
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('wp_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('wp_todos');
        return saved ? JSON.parse(saved) : [];
      });
      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('wp_schedules');
        return saved ? JSON.parse(saved) : [];
      });
      const [routines, setRoutines] = useState(() => {
        const saved = localStorage.getItem('wp_routines');
        return saved ? JSON.parse(saved) : INITIAL_ROUTINES;
      });
      const [monthlyPlans, setMonthlyPlans] = useState(() => {
        const saved = localStorage.getItem('wp_monthlyPlans');
        return saved ? JSON.parse(saved) : {};
      });

      const [weekOffset, setWeekOffset] = useState(0);
      const [currentMonthNav, setCurrentMonthNav] = useState(() => {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth() + 1 };
      });
      const [deleteModal, setDeleteModal] = useState({ isOpen: false, title: '', type: '', id: null });
      const [importModal, setImportModal] = useState({ isOpen: false, targetDate: '' });
      const [editCatModal, setEditCatModal] = useState({ isOpen: false, category: null });
      const [expandedScheduleId, setExpandedScheduleId] = useState(null);
      const [selectedStatPeriod, setSelectedStatPeriod] = useState('weekly');
      // [추가] 할 일 / 루틴 / 요일별 일정 / 월간 일정 공통 수정창
      const [editModal, setEditModal] = useState(null);
      // 루틴 최초 등록/수정: 제목과 월~일 반복 요일을 함께 선택하는 팝업
      const [routineModal, setRoutineModal] = useState(null);
      // 카테고리 간 할 일 가져오기: 원본 항목을 복사하지 않고 이동합니다.
      const [categoryImportModal, setCategoryImportModal] = useState(null);
      // 화면에 표시 중인 주의 요일별 일정을 할 일로 되돌리는 확인 창
      const [weekResetModal, setWeekResetModal] = useState(null);
      // 완료된 일정: 1차 선택 -> 영구 삭제 시 2차 확인
      const [completedActionModal, setCompletedActionModal] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [newTodoInput, setNewTodoInput] = useState('');
      const [selectedCatForNewTodo, setSelectedCatForNewTodo] = useState(INITIAL_CATEGORIES[0].id);
      const [newCatName, setNewCatName] = useState('');
      const [newRoutineInput, setNewRoutineInput] = useState('');
      const [newMonthlyInput, setNewMonthlyInput] = useState('');

      useEffect(() => {
        const timer = setTimeout(() => setShowSplash(false), 1500);
        return () => clearTimeout(timer);
      }, []);
      useEffect(() => { localStorage.setItem('wp_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('wp_todos', JSON.stringify(todos)); }, [todos]);
      useEffect(() => { localStorage.setItem('wp_schedules', JSON.stringify(schedules)); }, [schedules]);
      useEffect(() => { localStorage.setItem('wp_routines', JSON.stringify(routines)); }, [routines]);
      useEffect(() => { localStorage.setItem('wp_monthlyPlans', JSON.stringify(monthlyPlans)); }, [monthlyPlans]);

      // 월요일 00:00에 주가 바뀌도록 현지 날짜를 상태로 관리합니다.
      // 일요일은 기존 주의 마지막 날, 월요일은 새 주의 첫날입니다.
      const [todayStr, setTodayStr] = useState(() => getLocalDateString(new Date()));
      useEffect(() => {
        let midnightTimer;
        const refreshDate = () => setTodayStr(getLocalDateString(new Date()));
        const onVisibilityChange = () => {
          if (!document.hidden) refreshDate();
        };
        const scheduleMidnightUpdate = () => {
          const now = new Date();
          const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
          midnightTimer = setTimeout(() => {
            refreshDate();
            scheduleMidnightUpdate();
          }, Math.max(1, nextMidnight.getTime() - now.getTime() + 50));
        };
        scheduleMidnightUpdate();
        window.addEventListener('focus', refreshDate);
        document.addEventListener('visibilitychange', onVisibilityChange);
        return () => {
          clearTimeout(midnightTimer);
          window.removeEventListener('focus', refreshDate);
          document.removeEventListener('visibilitychange', onVisibilityChange);
        };
      }, []);

      const currentYear = new Date().getFullYear();
      // JS의 getDay(): 일요일=0, 월요일=1. (getDay()+6)%7을 이용해 월요일을 0으로 맞춥니다.
      // 현지 정오를 기준으로 날짜를 계산해 UTC 변환/서머타임 경계에서도 날짜가 밀리지 않게 합니다.
      const getWeekDaysByOffset = (offset) => {
        const curr = new Date(`${todayStr}T12:00:00`);
        const daysSinceMonday = (curr.getDay() + 6) % 7;
        curr.setDate(curr.getDate() - daysSinceMonday + offset * 7);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const next = new Date(curr.getFullYear(), curr.getMonth(), curr.getDate() + i, 12);
          days.push(getLocalDateString(next));
        }
        return days;
      };
      const weekDays = useMemo(() => getWeekDaysByOffset(weekOffset), [weekOffset, todayStr]);
      const weekSchedules = useMemo(() => schedules.filter(s => weekDays.includes(s.date)), [schedules, weekDays]);

      // [유지] 지난주 미완료 일정은 앱 시작 시 및 월요일 00:00 주간 전환 시 할 일로 복귀
      useEffect(() => {
        const mondayOfThisWeek = getWeekDaysByOffset(0)[0];
        const expiredUncompleted = schedules.filter(s => !s.completed && s.date < mondayOfThisWeek);
        if (expiredUncompleted.length > 0) {
          const restoredTodos = expiredUncompleted.map(item => ({
            id: item.sourceTodoId || `todo-restored-${Date.now()}-${Math.random()}`,
            categoryId: item.categoryId || 'cat-uncategorized',
            title: item.title, details: item.details || '', completed: false,
            createdAt: new Date().toISOString()
          }));
          setTodos(prev => [...restoredTodos, ...prev]);
          setSchedules(prev => prev.filter(s => !(!s.completed && s.date < mondayOfThisWeek)));
        }
      }, [todayStr]);

      const requestDelete = (title, type, id) => setDeleteModal({ isOpen: true, title, type, id });
      const confirmDelete = () => {
        const { type, id } = deleteModal;
        if (type === 'todo') setTodos(prev => prev.filter(i => i.id !== id));
        if (type === 'schedule') setSchedules(prev => prev.filter(i => i.id !== id));
        if (type === 'routine') setRoutines(prev => prev.filter(i => i.id !== id));
        if (type === 'monthly') {
          setMonthlyPlans(prev => {
            const copy = JSON.parse(JSON.stringify(prev));
            const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
            if (copy[y]?.months?.[m]) copy[y].months[m] = copy[y].months[m].filter(i => i.id !== id);
            return copy;
          });
        }
        if (type === 'category') {
          setCategories(prev => prev.filter(c => c.id !== id));
          setTodos(prev => prev.map(t => t.categoryId === id ? { ...t, categoryId: 'cat-uncategorized' } : t));
        }
        setDeleteModal({ isOpen: false, title: '', type: '', id: null });
      };

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodoInput.trim()) return;
        setTodos(prev => [{
          id: `todo-${Date.now()}`, categoryId: selectedCatForNewTodo,
          title: newTodoInput.trim(), details: '', completed: false,
          createdAt: new Date().toISOString()
        }, ...prev]);
        setNewTodoInput('');
      };
      const handleAddRoutine = (e) => {
        e.preventDefault();
        if (!newRoutineInput.trim()) return;
        // '추가'를 누르면 곧장 저장하지 않고 요일 선택 팝업을 표시한다.
        setRoutineModal({ id: null, title: newRoutineInput.trim(), scheduledWeekdays: [] });
      };
      const openRoutineEdit = (routine) => {
        setRoutineModal({
          id: routine.id,
          title: routine.title,
          scheduledWeekdays: [...routineWeekdays(routine)]
        });
      };
      const toggleRoutineModalWeekday = (index) => {
        setRoutineModal(prev => prev ? {
          ...prev,
          scheduledWeekdays: prev.scheduledWeekdays.includes(index)
            ? prev.scheduledWeekdays.filter(day => day !== index)
            : [...prev.scheduledWeekdays, index].sort((a, b) => a - b)
        } : null);
      };
      const saveRoutineModal = (e) => {
        e.preventDefault();
        if (!routineModal?.title.trim()) return;
        if (!routineModal.scheduledWeekdays.length) {
          alert('루틴을 진행할 요일을 한 개 이상 선택해 주세요.');
          return;
        }
        const title = routineModal.title.trim();
        const scheduledWeekdays = [...routineModal.scheduledWeekdays].sort((a, b) => a - b);
        if (routineModal.id) {
          // 기존 체크 이력과 루틴 순서는 그대로 보존
          setRoutines(prev => prev.map(r => r.id === routineModal.id
            ? { ...r, title, scheduledWeekdays } : r));
        } else {
          setRoutines(prev => [...prev, {
            id: `routine-${Date.now()}`,
            title, scheduledWeekdays, completedDays: {}
          }]);
          setNewRoutineInput('');
        }
        setRoutineModal(null);
      };
      const handleAddMonthlyPlan = (e) => {
        e.preventDefault();
        if (!newMonthlyInput.trim()) return;
        setMonthlyPlans(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
          if (!copy[y]) copy[y] = { year: currentMonthNav.year, months: {} };
          if (!copy[y].months[m]) copy[y].months[m] = [];
          copy[y].months[m].push({
            id: `mitem-${Date.now()}`, month: currentMonthNav.month,
            year: currentMonthNav.year, content: newMonthlyInput.trim(),
            details: '', createdAt: new Date().toISOString()
          });
          return copy;
        });
        setNewMonthlyInput('');
      };
      const toggleRoutineDay = (routineId, dateStr, weekdayIndex) => {
        setRoutines(prev => prev.map(r => {
          if (r.id !== routineId || !routineWeekdays(r).includes(weekdayIndex)) return r;
          return { ...r, completedDays: {
            ...r.completedDays, [dateStr]: !r.completedDays?.[dateStr]
          }};
        }));
      };
      const handleUpdateScheduleDetails = (id, details) => {
        setSchedules(prev => prev.map(s => s.id === id ? { ...s, details } : s));
      };
      const toggleScheduleComplete = (id) => {
        setSchedules(prev => prev.map(s => s.id === id ? {
          ...s, completed: !s.completed,
          completedAt: !s.completed ? getLocalDateString(new Date()) : null
        } : s));
      };
      const toggleTodoComplete = (id) => {
        setTodos(prev => prev.map(t => t.id === id ? {
          ...t, completed: !t.completed,
          completedAt: !t.completed ? getLocalDateString(new Date()) : null
        } : t));
      };
      const handleSaveCategory = () => {
        if (!newCatName.trim()) return;
        if (editCatModal.category) {
          setCategories(prev => prev.map(c => c.id === editCatModal.category.id ? { ...c, name: newCatName.trim() } : c));
        } else {
          setCategories(prev => [...prev, { id: `cat-${Date.now()}`, name: newCatName.trim(), order: categories.length + 1 }]);
        }
        setNewCatName('');
        setEditCatModal({ isOpen: false, category: null });
      };
      const handleImportTodoToSchedule = (todoItem) => {
        setSchedules(prev => [...prev, {
          id: `sched-${Date.now()}`, title: todoItem.title,
          details: todoItem.details || '', categoryId: todoItem.categoryId,
          date: importModal.targetDate, completed: false,
          sourceTodoId: todoItem.id, createdAt: new Date().toISOString()
        }]);
        setTodos(prev => prev.filter(t => t.id !== todoItem.id));
        setImportModal({ isOpen: false, targetDate: '' });
      };

      // [추가] 서로 다른 카테고리에서 할 일 가져오기 (복사 아닌 이동)
      const moveTodoToCategory = (todoId, targetCategoryId) => {
        if (!categories.some(c => c.id === targetCategoryId)) return;
        setTodos(prev => prev.map(t => t.id === todoId && !t.completed
          ? { ...t, categoryId: targetCategoryId } : t));
        setCategoryImportModal(null);
      };

      // [추가] 요일별 일정을 다시 할 일로 돌리는 공통 변환 함수.
      // sourceTodoId가 있으면 '가져온 일정'으로 간주하고 원래 카테고리로 보낸다.
      // 사용자가 요일별로 직접 등록한 일정은 미분류로 돌린다.
      const scheduleToTodo = (item, destinationCategoryId, occupiedIds) => {
        const preferredId = item.sourceTodoId;
        let id = preferredId && !occupiedIds.has(preferredId)
          ? preferredId : `todo-return-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        while (occupiedIds.has(id)) id = `todo-return-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        occupiedIds.add(id);
        return {
          id,
          categoryId: destinationCategoryId,
          title: item.title,
          details: item.details || '',
          completed: false,
          completedAt: null,
          createdAt: item.createdAt || new Date().toISOString()
        };
      };

      const requestResetWeek = () => {
        if (!weekSchedules.length) return;
        setWeekResetModal({ days: [...weekDays], count: weekSchedules.length });
      };
      const confirmResetWeek = () => {
        if (!weekResetModal) return;
        const targetDates = new Set(weekResetModal.days);
        const targets = schedules.filter(s => targetDates.has(s.date));
        const occupiedIds = new Set(todos.map(t => t.id));
        const restored = targets.map(item => {
          const originalCategory = item.sourceTodoId && categories.some(c => c.id === item.categoryId)
            ? item.categoryId : 'cat-uncategorized';
          return scheduleToTodo(item, originalCategory, occupiedIds);
        });
        const targetIds = new Set(targets.map(s => s.id));
        setTodos(prev => [...restored, ...prev]);
        setSchedules(prev => prev.filter(s => !targetIds.has(s.id)));
        setExpandedScheduleId(null);
        setWeekResetModal(null);
      };

      // [추가] 완료된 일정의 X 버튼: 미분류 복귀 또는 영구 삭제 선택
      const openCompletedActions = (item) => setCompletedActionModal({
        type: item.editType, id: item.id, title: item.title, step: 'choose'
      });
      const restoreCompletedToUncategorized = () => {
        if (!completedActionModal) return;
        const { type, id } = completedActionModal;
        if (type === 'todo') {
          setTodos(prev => prev.map(t => t.id === id
            ? { ...t, categoryId: 'cat-uncategorized', completed: false, completedAt: null } : t));
        } else if (type === 'schedule') {
          const source = schedules.find(s => s.id === id);
          if (source) {
            const occupiedIds = new Set(todos.map(t => t.id));
            const restored = scheduleToTodo(source, 'cat-uncategorized', occupiedIds);
            setTodos(prev => [restored, ...prev]);
            setSchedules(prev => prev.filter(s => s.id !== id));
          }
        }
        setCompletedActionModal(null);
      };
      const confirmDeleteCompleted = () => {
        if (!completedActionModal || completedActionModal.step !== 'confirm') return;
        const { type, id } = completedActionModal;
        if (type === 'todo') setTodos(prev => prev.filter(t => t.id !== id));
        if (type === 'schedule') setSchedules(prev => prev.filter(s => s.id !== id));
        setCompletedActionModal(null);
      };

      // [추가] 개별 수정 (완료 체크 기록과 기존 데이터 필드 유지)
      const openEdit = (type, item) => {
        if (type === 'routine') return openRoutineEdit(item);
        setEditModal({
          type, id: item.id,
          title: type === 'monthly' ? item.content : item.title,
          details: item.details || '',
          date: item.date || '',
          categoryId: item.categoryId || 'cat-uncategorized'
        });
      };
      const saveEdit = (e) => {
        e.preventDefault();
        if (!editModal || !editModal.title.trim()) return;
        const { type, id, title, details, date, categoryId } = editModal;
        const cleanTitle = title.trim();
        if (type === 'todo') {
          setTodos(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle, details,
            categoryId: categories.some(c => c.id === categoryId) ? categoryId : 'cat-uncategorized' } : i));
        } else if (type === 'routine') {
          setRoutines(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle } : i));
        } else if (type === 'schedule') {
          if (!date) return alert('이동할 날짜를 선택해 주세요.');
          setSchedules(prev => prev.map(i => i.id === id ? { ...i, title: cleanTitle, details, date } : i));
        } else if (type === 'monthly') {
          setMonthlyPlans(prev => {
            const copy = JSON.parse(JSON.stringify(prev));
            const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
            if (copy[y]?.months?.[m]) {
              copy[y].months[m] = copy[y].months[m].map(i => i.id === id ? { ...i, content: cleanTitle, details } : i);
            }
            return copy;
          });
        }
        setEditModal(null);
      };
      // [추가] 같은 주에서 요일 옮기기 / 공통 수정창에서 날짜 변경 가능
      const moveScheduleToDate = (id, date) => {
        if (!date) return;
        setSchedules(prev => prev.map(i => i.id === id ? { ...i, date } : i));
        setExpandedScheduleId(null);
      };
      // [추가] 같은 카테고리 및 같은 요일 내 순서 바꾸기
      const moveCategory = (item, direction) => setCategories(prev =>
        moveWithinGroup(prev, item.id, direction, () => true)
          .map((category, index) => ({ ...category, order: index + 1 })));
      const moveTodo = (item, direction) => setTodos(prev =>
        moveWithinGroup(prev, item.id, direction, i => i.categoryId === item.categoryId && !i.completed));
      const moveRoutine = (item, direction) => setRoutines(prev =>
        moveWithinGroup(prev, item.id, direction, () => true));
      const moveSchedule = (item, direction) => setSchedules(prev =>
        moveWithinGroup(prev, item.id, direction, i => i.date === item.date));
      const moveMonthly = (id, direction) => {
        setMonthlyPlans(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const y = String(currentMonthNav.year), m = String(currentMonthNav.month);
          if (copy[y]?.months?.[m]) {
            copy[y].months[m] = moveWithinGroup(copy[y].months[m], id, direction, () => true);
          }
          return copy;
        });
      };

      // [유지/개선] 백업·복원 (JSON 파일로 다운로드 및 파일 선택)
      const downloadBackup = () => {
        const data = {
          backupVersion: 1, backupDate: new Date().toISOString(),
          categories, todos, schedules, routines, monthlyPlans
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `weekly_planner_backup_${new Date().toLocaleDateString('sv-SE')}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };
      const restoreBackup = async (e) => {
        const input = e.currentTarget;
        const file = input.files?.[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const valid = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
            && Array.isArray(parsed.todos) && Array.isArray(parsed.schedules)
            && Array.isArray(parsed.routines) && parsed.monthlyPlans
            && typeof parsed.monthlyPlans === 'object' && !Array.isArray(parsed.monthlyPlans)
            && (parsed.categories === undefined || Array.isArray(parsed.categories));
          if (!valid) throw new Error('잘못된 백업 파일');
          if (!window.confirm('현재 저장된 데이터가 백업 파일 내용으로 변경됩니다. 계속하시겠습니까?')) return;
          if (parsed.categories) setCategories(parsed.categories);
          setTodos(parsed.todos);
          setSchedules(parsed.schedules);
          setRoutines(parsed.routines);
          setMonthlyPlans(parsed.monthlyPlans);
          alert('데이터가 성공적으로 복원되었습니다!');
        } catch (err) {
          alert('올바른 백업 JSON 파일이 아닙니다.');
        } finally {
          input.value = '';
        }
      };

      const stats = useMemo(() => {
        const completedSchedulesAll = schedules.filter(s => s.completed);
        const completedTodosAll = todos.filter(t => t.completed);
        const yearlyCompletedCount = completedSchedulesAll.length + completedTodosAll.length;
        const calcRate = (done, total) => total > 0 ? Math.round((done / total) * 100) : 0;
        let totalRoutineSlots = 0;
        let completedRoutineSlots = 0;
        routines.forEach(r => weekDays.forEach((date, weekdayIndex) => {
          if (!routineWeekdays(r).includes(weekdayIndex)) return;
          totalRoutineSlots++;
          if (r.completedDays?.[date]) completedRoutineSlots++;
        }));
        const routineRate = calcRate(completedRoutineSlots, totalRoutineSlots);
        const scheduleRate = calcRate(schedules.filter(s => s.completed).length, schedules.length);
        return {
          yearlyCompletedCount,
          weekly: { routineRate, scheduleRate },
          monthly: { routineRate, scheduleRate },
          yearly: { routineRate, scheduleRate }
        };
      }, [schedules, todos, routines, weekDays]);

      // 자주 사용하는 편집 / 순서 변경 버튼
      const EditButton = ({ onClick }) => (
        <button type="button" onClick={onClick} title="수정" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
          <Icon name="pencil" className="w-3.5 h-3.5" />
        </button>
      );
      const OrderButtons = ({ onUp, onDown }) => (
        <>
          <button type="button" onClick={onUp} title="위로 이동" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
            <Icon name="arrow-up" className="w-3.5 h-3.5" />
          </button>
          <button type="button" onClick={onDown} title="아래로 이동" className="text-slate-400 hover:text-chalcedony-600 p-1 rounded">
            <Icon name="arrow-down" className="w-3.5 h-3.5" />
          </button>
        </>
      );

      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-slate-900 text-white flex flex-col items-center justify-center z-50 p-4">
            <div className="text-center space-y-3 font-roboto-condensed tracking-wider">
              <h1 className="text-3xl font-bold text-chalcedony-400">MY WEEKLY PLANNER</h1>
              <p className="text-sm text-slate-300 font-light">- 개발자 : 이종민-</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-3 sm:px-6 pt-4">
          {/* ====== 헤더 (기존 디자인 유지) ====== */}
          <header className="bg-white border border-slate-200 rounded-2xl p-3 sm:p-4 mb-6 shadow-xs sticky top-2 z-30">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 flex-shrink-0">
                <div className="w-8 h-8 rounded-xl bg-chalcedony-500 flex items-center justify-center text-white font-bold text-sm shadow-sm">📅</div>
                <div>
                  <h1 className="text-sm font-bold text-slate-900 leading-none">MY WEEKLY PLANNER</h1>
                  <span className="text-[10px] text-chalcedony-600 font-semibold block mt-1">Chalcedony Edition</span>
                </div>
              </div>
              <nav className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-medium overflow-x-auto no-scrollbar">
                {[
                  ['todos', `할 일 (${todos.filter(t => !t.completed).length})`],
                  ['weekly', '주간'], ['monthly', '월간'],

                ].map(([id, label]) => (
                  <button key={id} onClick={() => setActiveTab(id)}
                    className={`whitespace-nowrap px-3 py-1.5 rounded-lg transition ${activeTab === id ? 'bg-chalcedony-500 text-white font-bold shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                    {label}
                  </button>

          {/* ====== 1. 할 일 ====== */}
          {activeTab === 'todos' && (

                <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">

                <form onSubmit={handleAddTodo} className="flex flex-col sm:flex-row gap-2">

              <div className="flex justify-between items-center px-1">

              <div className="space-y-4">

                                <input type="checkbox" checked={todo.completed} onChange={() => toggleTodoComplete(todo.id)}
                                  className="w-4 h-4 rounded text-chalcedony-500 focus:ring-chalcedony-400" />
                                <span className="text-xs text-slate-700 font-medium truncate">{todo.title}</span>
                                {todo.details?.trim() && <span title={todo.details} className="text-[10px] text-chalcedony-600 flex-shrink-0">메모</span>}
                              </label>
                              <div className="flex items-center flex-shrink-0">
                                <OrderButtons onUp={() => moveTodo(todo, -1)} onDown={() => moveTodo(todo, 1)} />
                                <EditButton onClick={() => openEdit('todo', todo)} />
                                <button onClick={() => requestDelete(todo.title, 'todo', todo.id)} className="text-slate-300 hover:text-red-500 p-1 rounded">
                                  <Icon name="x" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ====== 2. 주간 일정 ====== */}
          {activeTab === 'weekly' && (
            <div className="space-y-6">
              <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
                <button onClick={() => setWeekOffset(prev => prev - 1)}
                  className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1">
                  <Icon name="chevron-left" className="w-4 h-4" /> 이전 주
                </button>
                <div className="text-xs font-bold text-slate-800 text-center">
                  {weekDays[0]} ~ {weekDays[6]}
                </div>
                <button onClick={() => setWeekOffset(prev => prev + 1)}
                  className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1">
                  다음 주 <Icon name="chevron-right" className="w-4 h-4" />
                </button>
              </div>
              <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                  <h2 className="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                    <Icon name="repeat" className="w-4 h-4 text-chalcedony-500" /> 주간 루틴 체크
                  </h2>
                  <form onSubmit={handleAddRoutine} className="flex gap-1.5">
                    <input type="text" placeholder="새 루틴 입력..." value={newRoutineInput} onChange={e => setNewRoutineInput(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-xs rounded-lg px-2.5 py-1 outline-none focus:border-chalcedony-500 w-32 sm:w-44" />
                    <button type="submit" className="bg-chalcedony-500 text-white text-xs px-3 py-1 rounded-lg font-semibold hover:bg-chalcedony-600">추가</button>
                  </form>
                </div>
                {routines.length === 0 ? (
                  <p className="text-xs text-slate-400 py-3 text-center">등록된 루틴이 없습니다.</p>
                ) : (
                  <>
                    {/* 모바일: 이름/관리 버튼과 요일 체크를 분리해 모든 버튼이 보이도록 표시 */}
                    <div className="space-y-3 sm:hidden">
                      {routines.map(routine => (
                        <div key={routine.id} className="bg-slate-50 rounded-xl border border-slate-100 p-2.5 space-y-2">
                          <div className="flex items-center justify-between gap-1">
                            <button type="button" title="루틴과 반복 요일 수정" onClick={() => openRoutineEdit(routine)}
                              className="flex-1 min-w-0 text-left text-xs font-medium text-slate-700 truncate hover:text-chalcedony-600">
                              {routine.title}
                            </button>
                            <div className="flex shrink-0 items-center">
                              <OrderButtons onUp={() => moveRoutine(routine, -1)} onDown={() => moveRoutine(routine, 1)} />
                              <EditButton onClick={() => openRoutineEdit(routine)} />
                              <button type="button" onClick={() => requestDelete(routine.title, 'routine', routine.id)}
                                title="삭제" className="text-slate-300 hover:text-red-500 p-1 rounded">
                                <Icon name="x" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                          <div className="grid grid-cols-7 gap-1">
                            {weekDays.map((dateStr, idx) => {
                              const scheduled = routineWeekdays(routine).includes(idx);
                              const checked = !!routine.completedDays?.[dateStr];
                              return (
                                <div key={dateStr} className="flex flex-col items-center gap-1">
                                  <span className="text-[10px] text-slate-400">{WEEKDAYS[idx]}</span>
                                  <button type="button" disabled={!scheduled}
                                    aria-label={`${routine.title} ${WEEKDAYS[idx]}요일 ${scheduled ? (checked ? '완료 취소' : '완료 체크') : '미지정'}`}
                                    onClick={() => toggleRoutineDay(routine.id, dateStr, idx)}
                                    className={`w-7 h-7 rounded-lg flex items-center justify-center transition ${
                                      !scheduled ? 'bg-slate-100 text-slate-300 cursor-not-allowed' :
                                      checked ? 'bg-chalcedony-500 text-white font-bold shadow-xs' :
                                      'bg-chalcedony-100 text-chalcedony-700 border border-chalcedony-300 hover:bg-chalcedony-200'
                                    }`}>{scheduled && checked ? '✓' : ''}</button>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                    {/* 태블릿/PC: 기존 표 구성 유지 */}
                    <div className="hidden sm:block overflow-x-auto no-scrollbar">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-100 text-slate-400 font-semibold">

                        <tbody className="divide-y divide-slate-50">
                          {routines.map(routine => (
                            <tr key={routine.id} className="hover:bg-slate-50/50">
                              <td className="py-2.5 font-medium text-slate-700 max-w-[140px]">
                                <button type="button" onClick={() => openRoutineEdit(routine)} title="루틴과 반복 요일 수정"
                                  className="max-w-[140px] truncate text-left hover:text-chalcedony-600">
                                  {routine.title}
                                </button>
                              </td>
                              {weekDays.map((dateStr, idx) => {

          {/* ====== 카테고리 추가/수정 팝업 ====== */}
          {editCatModal.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800">{editCatModal.category ? '카테고리 수정' : '새 카테고리 추가'}</h3>
                <input type="text" placeholder="예: 🏠 가정, 🏥 병원 등" value={newCatName} onChange={e => setNewCatName(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                <div className="flex gap-2">
                  <button onClick={() => setEditCatModal({ isOpen: false, category: null })}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold">취소</button>
                  <button onClick={handleSaveCategory}
                    className="flex-1 bg-chalcedony-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-chalcedony-600">저장</button>
                </div>
              </div>
            </div>
          )}

          {/* ====== 루틴 등록/수정 + 반복 요일 선택 팝업 ====== */}
          {routineModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={saveRoutineModal} className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800">
                  {routineModal.id ? '루틴 수정 및 요일 선택' : '새 루틴 요일 설정'}
                </h3>
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-600">루틴 이름</label>
                  <input type="text" required autoFocus value={routineModal.title}
                    onChange={e => setRoutineModal(prev => ({ ...prev, title: e.target.value }))}
                    className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                </div>
                <div className="space-y-2">
                  <p className="text-xs font-semibold text-slate-600">진행할 요일 선택 (복수 선택 가능)</p>
                  <div className="grid grid-cols-7 gap-1.5">
                    {WEEKDAYS.map((dayName, idx) => {
                      const selected = routineModal.scheduledWeekdays.includes(idx);
                      return (
                        <button type="button" key={idx} onClick={() => toggleRoutineModalWeekday(idx)}
                          aria-pressed={selected}
                          className={`aspect-square rounded-lg text-xs font-bold transition ${selected
                            ? 'bg-chalcedony-500 text-white border border-chalcedony-600 shadow-xs'
                            : 'bg-slate-100 text-slate-500 border border-slate-200 hover:bg-chalcedony-50'}`}>
                          {dayName}
                        </button>
                      );
                    })}
                  </div>
                  <p className="text-[11px] text-slate-500">선택한 요일은 체크칸이 칼세도니색으로 표시됩니다. 미선택 요일은 회색이며 체크할 수 없습니다.</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setRoutineModal(null)}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold">취소</button>
                  <button type="submit" className="flex-1 bg-chalcedony-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-chalcedony-600">확인</button>
                </div>
              </form>
            </div>
          )}

          {/* ====== [추가] 공통 개별 수정 팝업 ====== */}
          {editModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEdit} className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-800">
                  {editModal.type === 'todo' ? '할 일 수정' : editModal.type === 'routine' ? '루틴 수정' : editModal.type === 'schedule' ? '요일별 일정 수정 · 날짜 이동' : '월간 일정 수정'}
                </h3>
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-600">제목</label>
                  <input type="text" required autoFocus value={editModal.title}
                    onChange={e => setEditModal(prev => ({ ...prev, title: e.target.value }))}
                    className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                </div>
                {editModal.type !== 'routine' && (
                  <div className="space-y-1.5">
                    <label className="text-xs font-semibold text-slate-600">세부 메모</label>
                    <textarea rows="3" value={editModal.details}
                      onChange={e => setEditModal(prev => ({ ...prev, details: e.target.value }))}
                      className="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                  </div>
                )}
                {editModal.type === 'todo' && (
                  <div className="space-y-1.5">
                    <label className="text-xs font-semibold text-slate-600">카테고리</label>
                    <select value={editModal.categoryId}
                      onChange={e => setEditModal(prev => ({ ...prev, categoryId: e.target.value }))}
                      className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500">
                      {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                    </select>
                  </div>
                )}
                {editModal.type === 'schedule' && (
                  <div className="space-y-1.5">
                    <label className="text-xs font-semibold text-slate-600">일정 날짜 (변경하면 해당 날짜로 이동)</label>
                    <input type="date" required value={editModal.date}
                      onChange={e => setEditModal(prev => ({ ...prev, date: e.target.value }))}
                      className="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2.5 outline-none focus:border-chalcedony-500" />
                    <p className="text-[10px] text-slate-400">지난주 이전으로 이동한 미완료 일정은 다음 앱 시작 때 할 일로 복귀하는 기존 규칙이 적용됩니다.</p>
                  </div>
                )}
                <div className="flex gap-2">
                  <button type="button" onClick={() => setEditModal(null)}
                    className="flex-1 bg-slate-100 text-slate-600 text-xs py-2.5 rounded-xl font-semibold">취소</button>
                  <button type="submit" className="flex-1 bg-chalcedony-500 text-white text-xs py-2.5 rounded-xl font-semibold hover:bg-chalcedony-600">저장</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
